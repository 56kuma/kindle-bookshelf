name = "kindle-bookshelf"
compatibility_date = "2026-06-14"
pages_build_output_dir = "dist"

# /api/books が R2 から CSV を読むためのバインド。
# Dashboard の手動バインドに頼らず、デプロイ時にここから確実に付与する。
[[r2_buckets]]
binding = "BOOKS_BUCKET"
bucket_name = "kindle-bookshelf-data"

# /api/comments がコメントを読み書きする D1 バインド。
# database_id は `npx wrangler d1 create kindle-comments` で発行した値を設定する。
[[d1_databases]]
binding = "COMMENTS_DB"
database_name = "kindle-comments"
database_id = "placeholder-run-wrangler-d1-create"
