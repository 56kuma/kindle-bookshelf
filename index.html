<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18221d">
    <meta
      name="description"
      content="購入済みKindle本を、タイトル・著者・ASIN・購入日から検索できる個人用本棚。"
    >
    <title>My Kindle Shelf</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-block">
          <p class="eyebrow">THE GOLDEN LIBRARY</p>
          <h1><span>My Kindle</span> Shelf</h1>
          <p class="intro">買った本を、すぐ見つける。</p>
        </div>
        <div class="golden-figure" aria-hidden="true">
          <div class="golden-large"></div>
          <div class="golden-small"></div>
          <span>1.618</span>
        </div>
      </div>
    </header>

    <main>
      <section class="search-section" aria-labelledby="search-heading">
        <div class="search-panel">
          <h2 id="search-heading" class="visually-hidden">本を検索する</h2>
          <label class="search-box" for="search-input">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z"/>
            </svg>
            <input
              id="search-input"
              type="search"
              placeholder="タイトル・著者・ASIN・購入日で検索"
              autocomplete="off"
            >
          </label>

          <div class="filter-row" aria-label="ジャンルで絞り込む">
            <div id="genre-filters" class="genre-filters"></div>
            <button
              id="comment-filter"
              class="filter-chip"
              type="button"
              aria-pressed="false"
            >
              <span class="filter-check" aria-hidden="true">✓</span>
              コメントあり
            </button>
          </div>

          <div class="controls">
            <label class="sort-control" for="sort-select">
              <span>並び順</span>
              <select id="sort-select">
                <option value="newest">購入日が新しい順</option>
                <option value="oldest">購入日が古い順</option>
                <option value="title">タイトル あいうえお順</option>
                <option value="author">著者 あいうえお順</option>
                <option value="genre">ジャンル順</option>
              </select>
            </label>

            <label class="file-button" for="csv-input">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5h14v-5"/>
              </svg>
              CSVを読み込む
            </label>
            <input id="csv-input" class="visually-hidden" type="file" accept=".csv,text/csv">
          </div>
        </div>
      </section>

      <section class="recent-section">
        <details id="recent-updates" class="recent-updates" hidden>
          <summary class="recent-summary">
            <svg class="recent-chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 9.5 6 6 6-6"/>
            </svg>
            <span class="recent-heading">最近の更新</span>
            <span id="recent-latest" class="recent-latest"></span>
          </summary>
          <ol id="recent-list" class="recent-list"></ol>
        </details>

        <details id="sync-log" class="recent-updates sync-log" hidden>
          <summary class="recent-summary">
            <svg class="recent-chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 9.5 6 6 6-6"/>
            </svg>
            <span class="recent-heading">同期ログ</span>
            <span id="sync-log-latest" class="recent-latest"></span>
          </summary>
          <ol id="sync-log-list" class="sync-log-list"></ol>
        </details>
      </section>

      <section class="shelf-section" aria-labelledby="shelf-heading">
        <div class="shelf-heading-row">
          <div>
            <p id="source-label" class="source-label">データを読み込み中</p>
            <h2 id="shelf-heading">わたしの本棚</h2>
            <p id="library-summary" class="library-summary"></p>
          </div>
          <p id="result-count" class="result-count" aria-live="polite">読み込み中...</p>
        </div>

        <div id="book-list" class="book-list" aria-live="polite"></div>
        <p id="load-sentinel" class="load-sentinel" aria-live="polite">読み込み中...</p>

        <div id="empty-state" class="empty-state" hidden>
          <span aria-hidden="true">0</span>
          <h3>本が見つかりませんでした</h3>
          <p>検索する言葉を短くするか、絞り込みを解除してください。</p>
          <button id="clear-search" type="button">検索と絞り込みをクリア</button>
        </div>
      </section>
    </main>

    <template id="book-card-template">
      <article class="book-card">
        <a class="cover-link" target="_blank" rel="noopener noreferrer">
          <div class="cover-wrap">
            <img class="book-cover" alt="" loading="lazy" referrerpolicy="no-referrer">
            <div class="cover-fallback" aria-hidden="true"></div>
          </div>
        </a>
        <div class="book-info">
          <div class="book-meta">
            <time class="purchase-date"></time>
            <span class="book-category"></span>
            <button class="comment-button" type="button" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 4.75h14a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5h-7.25L7 20v-3.75H5a1.5 1.5 0 0 1-1.5-1.5v-8.5A1.5 1.5 0 0 1 5 4.75Z"/>
                <path d="m9 13.5.4-2.1 4.9-4.9 1.7 1.7-4.9 4.9-2.1.4Z"/>
              </svg>
              <span class="comment-status-dot" aria-hidden="true"></span>
            </button>
          </div>
          <h3 class="book-title"></h3>
          <p class="series-progress" hidden></p>
          <p class="book-author"></p>
          <a class="book-asin" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </article>
    </template>

    <dialog id="comment-view-dialog" class="comment-view-dialog">
      <article class="comment-view-content">
        <div class="comment-dialog-header">
          <div>
            <p class="comment-eyebrow">MY COMMENT</p>
            <h2 id="comment-view-title"></h2>
          </div>
          <button
            id="comment-view-close"
            class="comment-close"
            type="button"
            aria-label="閉じる"
          >×</button>
        </div>

        <div id="comment-view-list" class="comment-thread"></div>

        <div class="comment-view-actions">
          <button id="comment-view-add" class="comment-save" type="button">
            コメントを追加
          </button>
          <button id="comment-view-cancel" class="comment-cancel" type="button">
            閉じる
          </button>
        </div>
      </article>
    </dialog>

    <dialog id="comment-dialog" class="comment-dialog">
      <form id="comment-form" class="comment-form">
        <div class="comment-dialog-header">
          <div>
            <p class="comment-eyebrow">MY COMMENT</p>
            <h2 id="comment-book-title"></h2>
          </div>
          <button
            id="comment-close"
            class="comment-close"
            type="button"
            aria-label="閉じる"
          >×</button>
        </div>

        <label class="comment-label" for="comment-text">
          <span id="comment-mode-label">新しいコメント</span>
          <textarea
            id="comment-text"
            rows="7"
            maxlength="1000"
            placeholder="感想、好きな場面、次に読みたい巻など"
          ></textarea>
        </label>

        <div class="comment-dialog-meta">
          <span id="comment-storage-label">このブラウザに保存されます</span>
          <span id="comment-count">0 / 1000</span>
        </div>

        <div class="comment-dialog-actions">
          <button id="comment-cancel" class="comment-cancel" type="button">
            キャンセル
          </button>
          <button id="comment-submit" class="comment-save" type="submit">追加</button>
        </div>
      </form>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
